[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-analytics"
version = "0.1.0"
description = "Limpieza, validación, métricas y reporte HTML de consumo energético de flotillas"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Carlos (Aloner23)" }]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "nbconvert>=7", "nbformat>=5", "ipykernel>=6"]

[project.scripts]
fleet-analytics = "fleet_analytics.__main__:main"

[tool.setuptools.packages.find]
include = ["fleet_analytics*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
